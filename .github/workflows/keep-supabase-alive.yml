name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 03:00 UTC (well under Supabase's 7-day inactivity limit)
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://fbbzfjmaswofckybdvtm.supabase.co/rest/v1/user_settings?select=user_id&limit=1" \
            -H "apikey: sb_publishable_LGLaMTz-Hovlh4dbVaflJA_QjVu5W7k" \
            -H "Authorization: Bearer sb_publishable_LGLaMTz-Hovlh4dbVaflJA_QjVu5W7k"
